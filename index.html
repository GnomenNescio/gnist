<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gnist: Activity Finder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="top-bar">
    <div class="brand">
      <div class="brand-shapes" aria-hidden="true">
        <span class="brand-shape brand-shape-semicircle"></span>
        <span class="brand-shape brand-shape-circle"></span>
        <span class="brand-shape brand-shape-triangle"></span>
        <span class="brand-shape brand-shape-square"></span>
        <span class="brand-shape brand-shape-diamond"></span>
      </div>
      <h1>GNIST</h1>

    </div>

    <button id="lang-toggle" type="button" aria-label="Switch language">EN</button>

    <nav id="filters" aria-label="Filters">
      <div class="filters-bar">

        <div class="dropdown" id="energy-dropdown">
          <button class="dropdown-trigger" id="energy-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="energy-panel">
            <span class="dropdown-label" id="energy-label-text">Energy</span>
            <span class="dropdown-chevron" aria-hidden="true">▾</span>
          </button>
          <div class="dropdown-panel" id="energy-panel" role="group" aria-labelledby="energy-trigger" hidden>
            <div class="dropdown-actions" data-group="energy" hidden>
              <button type="button" class="dropdown-action" data-group="energy">Clear</button>
            </div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="energy" data-value="Calm"><span class="check" aria-hidden="true"></span><span class="item-label">Calm</span></div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="energy" data-value="Active"><span class="check" aria-hidden="true"></span><span class="item-label">Active</span></div>
          </div>
        </div>

        <div class="dropdown" id="location-dropdown">
          <button class="dropdown-trigger" id="location-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="location-panel">
            <span class="dropdown-label" id="location-label-text">Location</span>
            <span class="dropdown-chevron" aria-hidden="true">▾</span>
          </button>
          <div class="dropdown-panel" id="location-panel" role="group" aria-labelledby="location-trigger" hidden>
            <div class="dropdown-actions" data-group="location" hidden>
              <button type="button" class="dropdown-action" data-group="location">Clear</button>
            </div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="location" data-value="Inside"><span class="check" aria-hidden="true"></span><span class="item-label">Inside</span></div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="location" data-value="At the table"><span class="check" aria-hidden="true"></span><span class="item-label">At the table</span></div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="location" data-value="Urban"><span class="check" aria-hidden="true"></span><span class="item-label">Urban</span></div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="location" data-value="Garden"><span class="check" aria-hidden="true"></span><span class="item-label">Garden</span></div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="location" data-value="Forest"><span class="check" aria-hidden="true"></span><span class="item-label">Forest</span></div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="location" data-value="Car"><span class="check" aria-hidden="true"></span><span class="item-label">Car</span></div>
          </div>
        </div>

        <div class="dropdown" id="conditions-dropdown">
          <button class="dropdown-trigger" id="conditions-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="conditions-panel">
            <span class="dropdown-label" id="conditions-label-text">Conditions</span>
            <span class="dropdown-chevron" aria-hidden="true">▾</span>
          </button>
          <div class="dropdown-panel" id="conditions-panel" role="group" aria-labelledby="conditions-trigger" hidden>
            <div class="dropdown-actions" data-group="conditions" hidden>
              <button type="button" class="dropdown-action" data-group="conditions">Clear</button>
            </div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="conditions" data-value="Sunny"><span class="check" aria-hidden="true"></span><span class="item-label">Sunny</span></div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="conditions" data-value="Cloudy"><span class="check" aria-hidden="true"></span><span class="item-label">Cloudy</span></div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="conditions" data-value="Rainy"><span class="check" aria-hidden="true"></span><span class="item-label">Rainy</span></div>
            <div class="dropdown-item" role="checkbox" aria-checked="false" tabindex="0" data-group="conditions" data-value="Snowy"><span class="check" aria-hidden="true"></span><span class="item-label">Snowy</span></div>
          </div>
        </div>

      </div>
    </nav>
  </header>

  <main>
    <div id="results-meta">
      <p id="match-count" aria-live="polite">…</p>
      <div class="meta-actions">
        <button id="show-all-button" type="button" class="meta-button" hidden>Show all matches</button>
        <button id="surprise-button" type="button" class="meta-button primary">Surprise me</button>
      </div>
    </div>

    <section id="results" aria-labelledby="results-heading">
      <h2 id="results-heading" class="visually-hidden">Ideas</h2>
      <div id="ideas">
        <p class="placeholder">Loading activities…</p>
      </div>
    </section>
  </main>

  <!-- Mobile bottom filter bar (hidden on desktop via CSS) -->
  <div id="bottom-filter-bar" style="display:none">
    <button class="bottom-trigger" type="button" data-group="energy" aria-expanded="false" aria-controls="bottom-sheet-energy">
      <span class="bottom-label" id="bottom-energy-label">Energy</span>
      <span aria-hidden="true">▾</span>
    </button>
    <button class="bottom-trigger" type="button" data-group="location" aria-expanded="false" aria-controls="bottom-sheet-location">
      <span class="bottom-label" id="bottom-location-label">Location</span>
      <span aria-hidden="true">▾</span>
    </button>
    <button class="bottom-trigger" type="button" data-group="conditions" aria-expanded="false" aria-controls="bottom-sheet-conditions">
      <span class="bottom-label" id="bottom-conditions-label">Conditions</span>
      <span aria-hidden="true">▾</span>
    </button>
  </div>

  <!-- Bottom sheets (mobile panels, share the same dropdown-item elements via JS sync) -->
  <div class="bottom-sheet" id="bottom-sheet-energy" role="group" aria-label="Energy filter"></div>
  <div class="bottom-sheet" id="bottom-sheet-location" role="group" aria-label="Location filter"></div>
  <div class="bottom-sheet" id="bottom-sheet-conditions" role="group" aria-label="Conditions filter"></div>

  <script src="script.js"></script>
</body>
</html>
